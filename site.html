<!DOCTYPE html>
<html>
<head>
    <title>Сайт</title>
    <link rel="stylesheet" href="site.css">
</head>
<body class="body">
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="logo.png" alt="logo">
            </div>
            <div class="menu">
                <div class="left-menu">
                    <a href="#SMS" class="bold">Отправить СМС</a>
                    <a href="calculator.html">Калькулятор</a>
                </div>
            </div>
            <div class="menu-register">
                <a href="#register">Авторизоваться</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="sms-card">
            <h1 class="sms-title">Отправить анонимное СМС</h1>
            <p class="sms-status">100% анонимно</p>
            <div class="sms-form">
                <div class="input-box">
                    <label>Отправитель</label>
                    <div class="fake-input">Анонимный</div>
                </div>
                <div class="input-box">
                    <label>Получатель</label>
                    <div class="fake-input">+7</div>
                </div>
                <button class="sms-btn">Отправить СМС</button>
            </div>
        </section>

        <aside class="photo-side">
            <img src="android.jpg" alt="android">
        </aside>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="info">
                <a href="#contacts">Контакты</a>
                <span class="separator">|</span>
                <a href="#PolCon">Политика конфиденциальности</a>
                <span class="separator">|</span>
                <a href="#Usl">Условия</a>
                <span class="separator">|</span>
                <a href="#Otp">Отписаться</a>
            </div>
        </div>
        <div class="adress">
            © 2025 www.costext.com
        </div>
    </footer>
</body>
</html>
