<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Costext — Отправить СМС</title>
    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="body">
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <a href="site.html"><img src="../img/logo.png" alt="logo"></a>
            </div>
            <div class="menu">
                <div class="left-menu">
                    <a href="site.html" class="bold">Отправить СМС</a>
                    <a href="calculator.html">Калькулятор</a>
                    <a href="authorinfo.html">Об авторе</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="top-content-wrapper">
            <section class="sms-card">
                <h1 class="sms-title">Отправить анонимное СМС</h1>
                <p class="sms-status">100% анонимно</p>
                <div class="sms-form">
                    <div class="input-box">
                        <label>Отправитель</label>
                        <div class="input">Анонимный</div>
                    </div>
                    <div class="input-box">
                        <label>Получатель</label>
                        <div class="input">+7</div>
                    </div>
                    <button class="sms-btn">Отправить СМС</button>
                </div>
            </section>

            <aside class="photo">
                <img src="../img/android.jpg" alt="android">
            </aside>
        </div>

        <div id="extra-cards"></div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="info">
                <a href="#">Контакты</a>
                <span style="color: #6c757d">|</span>
                <a href="#">Политика конфиденциальности</a>
                <span style="color: #6c757d">|</span>
                <a href="#">Условия</a>
            </div>
            <div class="adress">© 2025 www.costext.com</div>
        </div>
    </footer>

    <script type="module">
        import { ProductCardComponent } from "../components/product-card/index.js";
        const container = document.getElementById('extra-cards');

        const services = [
            { id: 101, src: "../img/treking.png", title: "Трекинг", text: "Отслеживайте статус доставки в реальном времени." },
            { id: 102, src: "../img/shablons.png", title: "Шаблоны", text: "Готовые пресеты текстов для быстрой отправки." },
            { id: 103, src: "../img/protection.jpg", title: "Защита", text: "Удаление истории сразу после прочтения." }
        ];

        services.forEach(data => {
            const card = new ProductCardComponent(container);
            card.render(data, () => {});
        });
    </script>
</body>
</html>
